name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend Pytest & Linting
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ican_test
          POSTGRES_USER: ican
          POSTGRES_PASSWORD: ican
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ican -d ican_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest
        env:
          SECRET_KEY: 'ci-secret-key-testing-only-1234567890'
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
          DATABASE_URL: 'postgres://ican:ican@127.0.0.1:5432/ican_test'
        run: |
          cd backend
          python -m pytest --cov=. --cov-report=term-missing

  frontend-test:
    name: Frontend Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest
        env:
          VITE_PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder
          VITE_ENABLE_PAYMENTS: 'true'
        run: |
          cd frontend
          npm run test -- --run

      - name: Build Application
        env:
          VITE_PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder
          VITE_ENABLE_PAYMENTS: 'true'
        run: |
          cd frontend
          npm run build
